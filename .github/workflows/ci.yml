name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generated schemes are up to date
        run: python3 scripts/generate.py --check
      - name: Installer syntax
        run: sh -n install.sh && dash -n install.sh && bash -n install.sh
      - name: Installer tests (dash)
        run: sh tests/test_install.sh dash
      - name: Installer tests (bash)
        run: sh tests/test_install.sh bash
